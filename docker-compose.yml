# 약온 로컬 개발 환경
#   docker compose up -d   # DB · Redis · S3(LocalStack) · 백엔드 · 프론트엔드(next dev, :3321)
name: yakon

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yakon
      POSTGRES_PASSWORD: yakon
      POSTGRES_DB: yakon
    ports:
      - "${POSTGRES_HOST_PORT:-5555}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yakon -d yakon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 로컬 S3 대체. 시작 시 infra/local/localstack/init-s3.sh 로 업로드 버킷 생성
  localstack:
    image: localstack/localstack:4.9
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./infra/local/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: dev
    env_file: ./backend/.env
    # 컨테이너 내부에서는 서비스 이름으로 접근 (.env 의 localhost 값을 덮어씀)
    environment:
      DATABASE_URL: postgresql+asyncpg://yakon:yakon@postgres:5432/yakon
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_PUBLIC_ENDPOINT_URL: http://localhost:4566
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # 로컬 프론트 소스를 마운트해 next dev 로 실행 (http://localhost:3321)
  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000  # 브라우저가 호출하는 주소
      NEXT_WATCH_POLL_MS: "1000"  # Windows 바인드 마운트는 파일 변경 이벤트가 전달되지 않아 폴링 사용 (next.config.ts)
    ports:
      - "${FRONTEND_HOST_PORT:-3321}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # 컨테이너(Linux)용 node_modules 유지
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres-data:

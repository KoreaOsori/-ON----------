# 80 포트 하나로 프론트엔드와 백엔드를 함께 서비스한다
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Docker DNS: 앱이 아직 없거나 재생성되어 IP가 바뀌어도 nginx는 계속 실행한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream backend:8000;
    set $frontend_upstream frontend:3000;

    # 앱/DB 상태와 분리해 EC2의 80번 포트 연결을 확인한다.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 백엔드 API (FastAPI 경로가 /api/v1 로 시작)
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # LLM 응답 대기
        proxy_buffering off;      # 스트리밍 응답
    }

    # 프론트엔드 (Next.js)
    location / {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

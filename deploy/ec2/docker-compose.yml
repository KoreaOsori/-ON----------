# EC2 배포용: nginx(80) → 프론트엔드(Next.js) / 백엔드(FastAPI, /api) + Redis
# DB 는 RDS, 파일 저장은 S3 (컨테이너로 띄우지 않음). AWS 권한은 EC2 IAM 역할을 쓰므로 키를 넣지 않는다.
#
#   cd deploy/ec2
#   cp .env.example .env   # 값 채우기 (Secrets Manager 참고)
#   docker compose up -d --build
name: pill-check

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ""  # 같은 주소(nginx)로 /api 호출
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      target: runtime
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 비회원 질문 횟수 제한 등 (EC2 안에서 실행, ElastiCache 미사용)
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
